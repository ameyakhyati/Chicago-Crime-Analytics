<!DOCTYPE html>
<head>
    <title>UseCase 2 - Crime Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav class="bg-body-tertiary">
        <div class="navbar-container">
            <h3>Chicago Crime Data Pipeline </h3>

            <div class="d-flex gap-2">
                <a href="/" class="btn btn-outline-primary">Crime Records</a>
                <a href="/usecase1" class="btn btn-outline-primary">UseCase 1</a>
                <a href="/usecase2" class="btn btn-primary">UseCase 2</a>
                <a href="/usecase3" class="btn btn-outline-primary">UseCase 3</a>
                <a href="/usecase4" class="btn btn-outline-primary">UseCase 4</a>
            </div>
        </div>
    </nav>

    <main>
        <div class="crime-page analytics-page">

            <div class="metadata-heading">
                <h1>Crime Analytics</h1>
                <p>Crime trends, categories, communities and arrest patterns</p>
            </div>

            <section class="analytics-section">
                <div class="row g-4">
                    <div class="col-lg-6">
                        <div class="card graph-card">
                            <div class="card-body">
                                <h3 class="card-title">Crime Yearly Trend</h3>

                                <img
                                    src="{{ url_for('static', filename='graphs/crime_yearly_trend.png') }}"
                                    class="img-fluid"
                                    alt="Crime Yearly Trend"
                                >
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="card graph-card">
                            <div class="card-body">
                                <h3 class="card-title">Top 10 Crime Categories</h3>

                                <img
                                    src="{{ url_for('static', filename='graphs/top_10_crime_categories.png') }}"
                                    class="img-fluid"
                                    alt="Top 10 Crime Categories"
                                >
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="card graph-card">
                            <div class="card-body">
                                <h3 class="card-title">Top 10 Communities</h3>

                                <img
                                    src="{{ url_for('static', filename='graphs/top_10_communities.png') }}"
                                    class="img-fluid"
                                    alt="Top 10 Communities"
                                >
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="card graph-card">
                            <div class="card-body">
                                <h3 class="card-title">Crime by Month and Day</h3>

                                <img
                                    src="{{ url_for('static', filename='graphs/crime_month_day_heatmap.png') }}"
                                    class="img-fluid"
                                    alt="Crime Frequency by Month and Day"
                                >
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 mx-auto">
                        <div class="card graph-card">
                            <div class="card-body">
                                <h3 class="card-title">Arrest Outcome</h3>

                                <img
                                    src="{{ url_for('static', filename='graphs/arrest_outcome.png') }}"
                                    class="img-fluid"
                                    alt="Arrest Outcome"
                                >
                            </div>
                        </div>
                    </div>

                </div>

            </section>

        </div>
    </main>

</body>
</html>
