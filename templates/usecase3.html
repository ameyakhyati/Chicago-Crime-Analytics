<!DOCTYPE html>
<head>
    <title>UseCase 3 - Crime Analysis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav class="bg-body-tertiary">
        <div class="navbar-container">
            <h3>Chicago Crime Data Pipeline </h3>

            <div class="d-flex gap-2">
                <a href="/" class="btn btn-outline-primary">Crime Records</a>
                <a href="/usecase1" class="btn btn-outline-primary">UseCase 1</a>
                <a href="/usecase2" class="btn btn-outline-primary">UseCase 2</a>
                <a href="/usecase3" class="btn btn-primary">UseCase 3</a>
                <a href="/usecase4" class="btn btn-outline-primary">UseCase 4</a>
            </div>
        </div>
    </nav>

    <main>
        <div class="crime-page analytics-page">

            <div class="metadata-heading">
                <h1>Crime Analysis</h1>
                <p>Crime intensity, community distribution and feature correlations</p>
            </div>

            <section class="analytics-section">

                <div class="row g-4">
                    <div class="col-lg-6">
                        <div class="card graph-card">
                            <div class="card-body">
                                <h3 class="card-title">Crime Hour Intensity</h3>

                                <img
                                    src="{{ url_for('static', filename='graphs/crime_hour_intensity.png') }}"
                                    class="img-fluid"
                                    alt="Crime Hour Intensity"
                                >
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="card graph-card">
                            <div class="card-body">
                                <h3 class="card-title">Community Crime Distribution</h3>

                                <img
                                    src="{{ url_for('static', filename='graphs/community_crime_distribution.png') }}"
                                    class="img-fluid"
                                    alt="Community Crime Distribution"
                                >
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 mx-auto">
                        <div class="card graph-card">
                            <div class="card-body">
                                <h3 class="card-title">Crime Correlation Heatmap</h3>

                                <img
                                    src="{{ url_for('static', filename='graphs/crime_correlation_heatmap.png') }}"
                                    class="img-fluid"
                                    alt="Crime Correlation Heatmap"
                                >
                            </div>
                        </div>
                    </div>

                </div>

            </section>

        </div>
    </main>

</body>
</html>
